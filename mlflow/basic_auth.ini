# MLflow's login (basic-auth app), as docker-compose.yml runs it. The admin password
# is not stored here: the server takes it from MLFLOW_AUTH_ADMIN_PASSWORD, set from
# MLFLOW_TRACKING_PASSWORD in .env, the first time it starts on an empty user store.
[mlflow]
# Users other than the admin see nothing until they are granted access.
default_permission = NO_PERMISSIONS
# Kept in the mlflow-data volume, beside the tracking database.
database_uri = sqlite:////mlflow/basic_auth.db
admin_username = admin
authorization_function = mlflow.server.auth:authenticate_request_basic_auth
grant_default_workspace_access = false
