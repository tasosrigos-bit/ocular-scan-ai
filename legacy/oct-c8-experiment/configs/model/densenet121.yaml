# Primary backbone. DenseNet-121, ImageNet-pretrained, 8-class head.
name: densenet121
timm_name: densenet121
pretrained: true
in_chans: 3                 # grayscale OCT expanded to 3ch in preprocessing
num_classes: 8
drop_rate: 0.2
# layers to keep frozen for the first `freeze_epochs` (see training config)
freeze_backbone_initially: true
head_lr_mult: 10.0         # head trains faster than the unfrozen backbone
