[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oct-cds"
version = "0.1.0"
description = "OCT-based retinal disease classification with AI clinical decision support"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "pradamehav" }]

dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0.3",
    "lightning>=2.2",          # provides `import lightning.pytorch`
    "torchmetrics>=1.3",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "pillow>=10.2",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
explain = ["grad-cam>=1.5", "matplotlib>=3.8"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
track = ["mlflow>=2.11"]
notebook = ["jupyter>=1.0", "nbconvert>=7.0", "matplotlib>=3.8"]
# Part 2 — RAG narrator (local Qwen backend + retrieval)
rag = [
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "transformers>=4.44",
    "accelerate>=0.33",
]
rag-api = ["anthropic>=0.40"]   # only for rag.llm.backend=anthropic
app = ["streamlit>=1.36"]       # app/case_browser.py — reads pre-computed artifacts only
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.3", "black>=24.2"]

[project.scripts]
oct-cds = "oct_cds.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
