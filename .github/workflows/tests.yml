name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # sync_cpu.sh installs the lock with CPU-only PyTorch, skipping the CUDA build
      # and its nvidia packages, which the tests do not need.
      - name: Install dependencies
        run: scripts/sync_cpu.sh

      # The slow tests need the checkpoint and the clinic scans, which are not in the
      # repository, so CI runs the default selection, which leaves them out.
      - name: Run tests
        run: uv run --no-sync pytest -v
